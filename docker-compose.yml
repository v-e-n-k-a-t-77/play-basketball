services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: playbasketball
      POSTGRES_PASSWORD: playbasketball
      POSTGRES_DB: playbasketball
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playbasketball"]
      interval: 5s
      retries: 10
     
  db_test:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: playbasketball
      POSTGRES_PASSWORD: playbasketball
      POSTGRES_DB: playbasketball_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data    

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  dbdata: